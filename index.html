    <div id="daily-view">
    <h1 class="sr-only">早晚打卡</h1>
    <div class="dashboard">
      <section id="action-card" class="card card-border action-card" aria-labelledby="action-title">
        <div class="action-stage">
          <svg class="action-sketch" id="action-sketch" viewBox="0 0 120 72" aria-hidden="true" focusable="false"><use href="#drawing-brush"></use></svg>
          <details class="companion" id="ritual-scene">
            <summary id="bird-metrics" title="小鸟的成长与喂食" aria-label="小鸟的成长与喂食">
              <span class="scene-print" aria-hidden="true">
                <span class="morning-landscape"><i class="rising-sun"></i><i class="distant-hill"></i><i class="near-hill"></i></span>
                <span class="evening-window"><i class="window-stars"></i><i class="lamplight"></i><i class="window-frame"></i></span>
                <span class="window-sill"></span><span class="sparrow"></span><i class="grain"></i>
              </span>
              <span class="feed-reward" aria-hidden="true"><svg class="line-icon"><use href="#icon-grain"></use></svg>+1</span>
              <span class="bird-stats" aria-hidden="true">
                <span><svg class="line-icon"><use href="#icon-feather"></use></svg><span id="bird-days"></span>天</span>
                <span><svg class="line-icon"><use href="#icon-grain"></use></svg><span id="meal-value"></span></span>
              </span>
            </summary>
            <div class="bird-detail">
              <p id="bird-growth"></p><p id="meal-count"></p>
              <p id="completion-feedback" hidden></p>
              <p class="growth-threshold">累计 7 天长成幼鸟，30 天长成成鸟。</p>
            </div>
          </details>
          <div class="action-primary">
            <div class="action-controls">
              <h2 id="action-title" tabindex="-1"><button type="button" class="check-button" id="complete-action" aria-pressed="false"><span id="action-name"></span><span class="check-disc" aria-hidden="true"><svg class="line-icon"><use id="complete-glyph" href="#icon-check"></use></svg></span></button><span id="round-title" hidden></span></h2>
              <details id="action-options" class="action-options">
                <summary class="btn btn-ghost btn-circle" aria-label="本项选项"><svg class="line-icon" aria-hidden="true"><use href="#icon-dots"></use></svg></summary>
                <div class="action-tools">
                  <button class="btn btn-ghost" type="button" id="skip-action">暂时跳过</button>
                  <button class="btn btn-ghost" type="button" id="undo-skip" hidden>撤销跳过</button>
                </div>
              </details>
            </div>
            <p id="action-description" hidden></p>
            <button type="button" class="btn btn-soft btn-sm breath-link" id="start-breath" hidden>呼吸引导</button>
          </div>
        </div>
        <blockquote class="habit-quote" id="habit-quote"></blockquote>
      </section>
      <div class="routine-strip">
        <details class="routine-panel" id="routine-list">
          <summary class="routine-heading" title="习惯清单">
            <svg class="line-icon" aria-hidden="true"><use href="#icon-checklist"></use></svg>
            <span class="sr-only">习惯清单</span>
            <span class="routine-count"><progress id="routine-meter" aria-hidden="true" max="1" value="0"></progress><span id="routine-progress"></span><span class="sr-only">已完成</span></span>
          </summary>
          <ul id="routine-actions" class="routine-actions"></ul>
        </details>
        <button type="button" class="btn btn-ghost" id="manage-habits" aria-label="管理习惯" title="添加 / 排序">管理</button>
      </div>
      <details id="supplement-panel" class="collapse collapse-arrow supplement-panel">
        <summary class="collapse-title">
          <span class="habit-icon"><svg class="line-icon" aria-hidden="true"><use href="#icon-supplement"></use></svg></span>
          <span>补品</span><span id="supplement-count" class="badge badge-soft badge-primary supplement-count"></span>
        </summary>
        <div class="collapse-content supplement-content">
          <blockquote class="habit-quote" id="supplement-quote"></blockquote>
          <p id="supplement-message" hidden></p>
          <ul id="supplement-items" class="supplement-items"></ul>
          <button id="manage-supplements" class="btn btn-soft" type="button">管理补品</button>
        </div>
      </details>
      <details id="night-note" class="collapse collapse-arrow note-panel" hidden>
        <summary class="collapse-title"><span>昨晚小记</span><time class="note-date" id="note-date"></time></summary>
        <form id="note-form" class="collapse-content note-form">
          <div class="time-field">
            <label for="lights-out">大概几点关灯</label>
            <input class="input" id="lights-out" name="lightsOut" type="time">
          </div>
          <fieldset class="snack-field">
            <legend>吃夜宵了吗</legend>
            <div class="snack-options">
              <label><input name="snack" type="radio" value="yes"> 有</label>
              <label><input name="snack" type="radio" value="no"> 没有</label>
              <label><input name="snack" type="radio" value="" checked> 未记录</label>
            </div>
          </fieldset>
          <div class="note-footer">
            <button class="btn btn-soft" type="submit">保存小记</button>
            <span id="note-feedback" role="status"></span>
          </div>
        </form>
      </details>
    </div>
    </div>
    <section class="history-view" id="history-view" aria-labelledby="heatmap-title" hidden>
      <div class="history-heading">
        <h1 id="heatmap-title" tabindex="-1">习惯足迹</h1>
        <div class="history-ranges" role="group" aria-label="统计范围">
          <button type="button" data-range="week" aria-pressed="false">周</button>
          <button type="button" data-range="month" aria-pressed="true">月</button>
          <button type="button" data-range="year" aria-pressed="false">年</button>
        </div>
      </div>
      <div class="heatmap-panel">
        <div class="history-filter">
          <label class="sr-only" for="history-habit">选择习惯</label>
          <select id="history-habit" class="select"></select>
          <p class="heatmap-total" id="heatmap-total"></p>
        </div>
        <div class="history-navigation">
          <button type="button" id="history-previous" class="btn btn-ghost" aria-label="上一周期">‹</button>
          <strong id="history-period" tabindex="-1"></strong>
          <button type="button" id="history-next" class="btn btn-ghost" aria-label="下一周期">›</button>
        </div>
        <div id="habit-heatmap"></div>
        <div class="heatmap-footer">
          <div class="heatmap-legend" role="group" aria-label="图例">
            <span><i class="done" aria-hidden="true"></i>已记</span><span><i aria-hidden="true"></i>未记</span><span><i class="future" aria-hidden="true"></i>未来</span>
          </div>
          <p class="habit-consistency" id="habit-consistency"></p>
        </div>
        <p id="heatmap-detail" role="status" class="muted"></p>
      </div>
      <details id="week-notes" class="collapse collapse-arrow week-notes" hidden>
        <summary class="collapse-title">近期小记</summary>
        <ul class="collapse-content" id="week-note-list"></ul>
      </details>
    </section>
  </main>
  <div class="sr-only" id="action-announcement" role="status" aria-atomic="true"></div>
  <dialog id="habit-dialog" class="modal app-dialog" aria-labelledby="habit-dialog-title">
    <div class="modal-box"><div class="dialog-heading"><h2 id="habit-dialog-title">安排习惯</h2><form method="dialog"><button class="btn btn-ghost">关闭</button></form></div>
    <p class="muted" id="habit-period-label"></p>
    <p class="muted">按顺序逐个完成；可调整位置或暂时停用，历史记录会保留。</p>
    <ol id="habit-settings" class="habit-settings"></ol>
    <form id="habit-form" class="supplement-form" aria-label="添加习惯"><label for="habit-name">新习惯名称（必填，1–40 字）</label><input class="input" id="habit-name" name="name" maxlength="40" required placeholder="例如：练琴十分钟" autocomplete="off" enterkeyhint="done"><button type="submit" class="btn btn-primary">添加到当前时段</button></form>
    <p id="habit-feedback" class="muted" role="status"></p></div>
  </dialog>
  <dialog id="breath-dialog" class="modal app-dialog breath-dialog" aria-labelledby="breath-title">
    <div class="modal-box">
    <h2 id="breath-title">呼吸一分钟</h2>
    <div class="breath-ring" id="breath-ring" aria-hidden="true"><span id="breath-display"></span></div>
    <p class="sr-only" id="breath-instruction" role="status"></p>
    <p id="breath-remaining" class="breath-remaining"></p>
    <form method="dialog"><button class="btn btn-soft" type="submit" autofocus>结束练习</button></form>
    </div>
  </dialog>
  <dialog id="supplement-dialog" class="modal app-dialog supplement-dialog" aria-labelledby="supplement-dialog-title">
    <div class="modal-box">
    <div class="dialog-heading">
      <h2 id="supplement-dialog-title">管理补品</h2>
      <form method="dialog"><button class="btn btn-ghost" type="submit">关闭</button></form>
    </div>
    <ul id="supplement-settings" class="supplement-settings"></ul>
    <form id="supplement-form" class="supplement-form" aria-label="补品设置">
      <div class="form-fields">
        <div><label for="supplement-name">名称</label><input class="input" id="supplement-name" name="name" maxlength="40" required autofocus></div>
        <div><label for="supplement-period">时段</label><select class="select" id="supplement-period" name="period"><option value="morning">早晨</option><option value="evening">晚上</option></select></div>
      </div>
      <div class="note-footer">
        <button type="submit" class="btn btn-primary" id="save-supplement">添加补品</button>
        <button type="button" class="btn btn-ghost" id="cancel-supplement-edit" hidden>取消编辑</button>
        <span id="supplement-feedback" role="status"></span>
      </div>
    </form>
    </div>
  </dialog>
</body>
</html>
